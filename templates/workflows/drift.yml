# Standards drift check (ecosystem 16). Copy to .github/workflows/drift.yml. Also call drift.yml from
# ci.yml for PRs that touch standards.lock or a byte-matched file if you want PR-time feedback.
name: drift

on:
  schedule:
    - cron: "0 12 * * 1"   # Monday 09:00 ART, next to the weekly dependency PR
  pull_request:
    paths: [standards.lock]
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    uses: gonzalomartinperez/engineering-standards/.github/workflows/drift.yml@STANDARDS_SHA # STANDARDS_TAG
    permissions:
      contents: read
