# Weekly single dependency PR (ecosystem standard section 5), main-only flow: target main.
# Generated from templates/dependabot/main-only.yml; verified by tests/test_dependabot_policy.py.
version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: main
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
