# Reusable workflow: PR-time security set (ecosystem 6.4 and 7).
#
#   security:
#     needs: classify
#     uses: gonzalomartinperez/engineering-standards/.github/workflows/security.yml@<sha> # vX.Y.Z
#     permissions:
#       contents: read
#       pull-requests: read     # dependency-review summary and gitleaks PR scan
#     with:
#       dependency-review: true # public repos (free); private repos use the daily osv job instead
#
# Jobs: zizmor (workflow security), actionlint, gitleaks (secrets), dependency-review (PRs only).
# dependency-review needs the dependency graph enabled (default on public repos); licences that are not
# SPDX expressions ("SEE LICENSE IN ...") fail it: extend `allow-licenses` or set it to "" to skip.
# CodeQL is not run here: public repos enable CodeQL default setup (see docs/how-to/codeql.md).
name: security

on:
  workflow_call:
    inputs:
      zizmor:
        description: Run zizmor on .github/workflows and composite actions.
        type: boolean
        default: true
      zizmor-min-severity:
        description: Lowest zizmor severity that fails the job (informational, low, medium, high).
        type: string
        default: medium
      actionlint:
        description: Run actionlint.
        type: boolean
        default: true
      gitleaks:
        description: >-
          Run gitleaks: PR commits on pull_request, pushed commits on push, full history on schedule and
          workflow_dispatch (schedule a weekly full scan). Skipped on merge_group (not supported by the action;
          the commits were scanned on the PR).
        type: boolean
        default: true
      dependency-review:
        description: Run dependency-review on pull requests (public repos, or private with GitHub Advanced Security).
        type: boolean
        default: true
      dependency-review-fail-on-severity:
        description: Severity that fails dependency-review.
        type: string
        default: high
      allow-licenses:
        description: Comma-separated SPDX allow-list for dependency-review (empty disables the licence check).
        type: string
        default: "MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSD-3-Clause-Clear, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0, PSF-2.0, Zlib, MPL-2.0"

    secrets:
      GITLEAKS_LICENSE:
        description: Only for organization-owned repositories (personal accounts need no licence).
        required: false

permissions: {}

jobs:
  zizmor:
    if: inputs.zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: regular
          min-severity: ${{ inputs.zizmor-min-severity }}
          online-audits: true

  actionlint:
    if: inputs.actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  gitleaks:
    if: inputs.gitleaks && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
          comment-summary-in-pr: never
