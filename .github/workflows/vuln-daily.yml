# Reusable workflow: daily vulnerability job (ecosystem 5.5 as amended by OD-75).
#
# Caller (templates/workflows/vuln-daily.yml):
#   on:
#     schedule:
#       - cron: "0 10 * * *"         # daily 07:00 ART; the Monday run also posts the weekly summary
#     workflow_dispatch:
#   jobs:
#     vuln:
#       uses: gonzalomartinperez/engineering-standards/.github/workflows/vuln-daily.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         issues: write
#       with:
#         images: ""                  # vps-ops: newline-separated image@sha256 refs from releases/production.lock
#
# What it does: osv-scanner over every lockfile (full, recursive), a compromise watch of workflow
# `uses:` against known-compromised actions, optional Grype scans of deployed digests (E8), and then
# updates ONE tracking issue (label `vuln`) silently. It never opens a PR, never opens a second
# issue and never mentions anyone. Only the Monday run (America/Argentina/Buenos_Aires) adds one
# summary comment, which is the single weekly notification (OD-75). Findings never fail the job;
# scanner errors do.
name: vuln-daily

on:
  workflow_call:
    inputs:
      images:
        description: Newline-separated image references (by digest) to scan with Grype (public or anonymously pullable images).
        type: string
        default: ""
      summary-weekday:
        description: ISO weekday (1 = Monday) on which the summary comment is posted, in America/Argentina/Buenos_Aires.
        type: number
        default: 1
      force-summary:
        description: Post the summary comment regardless of the weekday (manual runs).
        type: boolean
        default: false
      tracker-title:
        type: string
        default: Dependency and vulnerability tracker
      tracker-label:
        type: string
        default: vuln

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner (full, recursive)
        id: osv
        continue-on-error: true   # exit code 1 means "vulnerabilities found"; parsed below
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./
      - name: Validate osv output
        id: osv-result
        shell: python
        run: |
          # osv-scanner exits 1 when it finds vulnerabilities; a missing or broken report is a real error.
          import json, sys
          try:
              with open("osv-results.json", encoding="utf-8") as fh:
                  if not isinstance(json.load(fh).get("results"), list):
                      raise ValueError("no 'results' list")
          except Exception as exc:  # noqa: BLE001
              print(f"::error title=osv-scanner::no usable result ({exc})")
              sys.exit(1)
      - name: Grype on deployed digests
        if: inputs.images != ''
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Scan images
        if: inputs.images != ''
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGES: ${{ inputs.images }}
        run: |
          mkdir -p grype
          i=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            i=$((i + 1))
            "$GRYPE" "registry:$image" -o json --only-fixed > "grype/$i.json"
          done <<< "$IMAGES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vuln-scan
          path: |
            osv-results.json
            grype/
          if-no-files-found: ignore
          retention-days: 14

  record:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: vuln-daily-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vuln-scan
          path: scan
      - name: Update the tracking issue
        id: record
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_WEEKDAY: ${{ inputs.summary-weekday }}
          FORCE_SUMMARY: ${{ inputs.force-summary }}
          TRACKER_TITLE: ${{ inputs.tracker-title }}
          TRACKER_LABEL: ${{ inputs.tracker-label }}
        run: |
          # vuln-daily v1 — tests extract this block and run it against fixtures and a fake API.
          import datetime, glob, json, os, re, sys, urllib.error, urllib.parse, urllib.request

          SECTION = "vuln-daily"
          MARKER = "<!-- tracking-issue -->"
          ART = datetime.timezone(datetime.timedelta(hours=-3))  # America/Argentina/Buenos_Aires, no DST
          # Known-compromised or banned action refs (ecosystem 6.4); extend through a standards release.
          COMPROMISED = [
              (re.compile(r"^tj-actions/changed-files@"), "tj-actions/changed-files (CVE-2025-30066)"),
              (re.compile(r"^tj-actions/"), "tj-actions/* banned by the standard"),
              (re.compile(r"^reviewdog/action-setup@"), "reviewdog/action-setup (CVE-2025-30154)"),
              (re.compile(r"^aquasecurity/trivy-action@"), "aquasecurity/trivy-action (2026-03 tag compromise)"),
              (re.compile(r"^aquasecurity/setup-trivy@"), "aquasecurity/setup-trivy (2026-03 tag compromise)"),
          ]


          SEVERITY_ORDER = ["CRITICAL", "HIGH", "MODERATE", "MEDIUM", "LOW", "UNKNOWN"]


          def code(value):
              """Inline code span: neutralises @-mentions (scoped packages), #-references, pipes, newlines."""
              text = " ".join(re.sub(r"[`|]+", " ", str(value)).split())
              return f"`{text}`"


          def worst(severities):
              return min(severities, key=lambda s: SEVERITY_ORDER.index(s) if s in SEVERITY_ORDER else len(SEVERITY_ORDER))


          def severity_of(vuln):
              for item in vuln.get("database_specific", {}), *[a.get("database_specific", {}) for a in vuln.get("affected", [])]:
                  sev = (item or {}).get("severity")
                  if isinstance(sev, str) and sev:
                      return sev.upper()
              return "UNKNOWN"


          def parse_osv(data):
              rows = []
              for result in data.get("results", []):
                  source = result.get("source", {}).get("path", "?")
                  for pkg in result.get("packages", []):
                      p = pkg.get("package", {})
                      vulns = {v.get("id", "?"): v for v in pkg.get("vulnerabilities", [])}
                      # One finding per alias group (GHSA, PYSEC, CVE of the same flaw are one row).
                      groups = [g.get("ids", []) for g in pkg.get("groups", [])] or [[i] for i in vulns]
                      for ids in groups:
                          ids = [i for i in ids if i in vulns] or ids
                          if not ids:
                              continue
                          rows.append({"id": ", ".join(ids), "package": p.get("name", "?"),
                                       "version": p.get("version", "?"), "ecosystem": p.get("ecosystem", "?"),
                                       "severity": worst([severity_of(vulns[i]) for i in ids if i in vulns] or ["UNKNOWN"]),
                                       "source": source})
              return sorted(rows, key=lambda r: (SEVERITY_ORDER.index(r["severity"]) if r["severity"] in SEVERITY_ORDER else 99,
                                                 r["package"], r["id"]))


          def parse_grype(paths):
              rows = []
              for path in paths:
                  with open(path, encoding="utf-8") as fh:
                      data = json.load(fh)
                  image = data.get("source", {}).get("target", {}).get("userInput", path)
                  for m in data.get("matches", []):
                      v, a = m.get("vulnerability", {}), m.get("artifact", {})
                      rows.append({"id": v.get("id", "?"), "package": a.get("name", "?"), "version": a.get("version", "?"),
                                   "ecosystem": "image", "severity": (v.get("severity") or "UNKNOWN").upper(), "source": image})
              return rows


          def compromise_watch(root=".github"):
              hits = []
              for path in sorted(glob.glob(f"{root}/**/*.y*ml", recursive=True)):
                  with open(path, encoding="utf-8") as fh:
                      for n, line in enumerate(fh, 1):
                          m = re.match(r"^\s*(?:-\s*)?uses:\s*['\"]?([^\s'\"#]+)", line)
                          if not m:
                              continue
                          for pattern, label in COMPROMISED:
                              if pattern.match(m.group(1)):
                                  hits.append(f"{code(f'{path}:{n}')} uses {code(label)}")
                                  break
              return hits


          def render(rows, hits, now):
              counts = {}
              for r in rows:
                  counts[r["severity"]] = counts.get(r["severity"], 0) + 1
              lines = [f"### Vulnerabilities (updated {now:%Y-%m-%d %H:%M} UTC)", ""]
              lines.append("Open findings: " + (", ".join(f"{k.lower()} {v}" for k, v in sorted(counts.items())) or "none") + ".")
              if hits:
                  lines += ["", "**Compromise watch:** " + "; ".join(hits)]
              if rows:
                  lines += ["", "| Severity | ID | Package | Version | Source |", "|---|---|---|---|---|"]
                  lines += [f"| {r['severity']} | {code(r['id'])} | {code(r['package'])} | {code(r['version'])} | {code(r['source'])} |"
                            for r in rows[:100]]
                  if len(rows) > 100:
                      lines.append(f"\n{len(rows) - 100} more in the run artifact.")
              lines += ["", "SLA (ecosystem 5.5): KEV or exploited 72 h; critical 7 days (may ride the weekly PR); "
                        "high 30 days; medium 90 days. Urgent fixes go through a normal task-branch PR."]
              return "\n".join(lines), counts


          def should_summarize(now, weekday, force):
              return force or now.astimezone(ART).isoweekday() == weekday


          def main():
              now = datetime.datetime.now(datetime.timezone.utc)
              with open("scan/osv-results.json", encoding="utf-8") as fh:
                  rows = parse_osv(json.load(fh))
              rows += parse_grype(sorted(glob.glob("scan/grype/*.json")))
              hits = compromise_watch()
              content, counts = render(rows, hits, now)

              api_base, repo, token = os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]

              def call(method, path, body=None):
                  req = urllib.request.Request(f"{api_base}/repos/{repo}{path}", method=method,
                                               data=json.dumps(body).encode() if body is not None else None,
                                               headers={"Authorization": f"Bearer {token}",
                                                        "Accept": "application/vnd.github+json",
                                                        "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else None

              title, label = os.environ["TRACKER_TITLE"], os.environ["TRACKER_LABEL"]
              candidates = [i for i in call("GET", f"/issues?state=open&labels={urllib.parse.quote(label)}&per_page=100") or []
                            if "pull_request" not in i]
              tracker = next((i for i in candidates if i.get("title") == title), None) or next(
                  (i for i in candidates if MARKER in (i.get("body") or "")), None)  # renamed tracker keeps its marker
              if tracker is None:
                  try:
                      call("POST", "/labels", {"name": label, "color": "b60205", "description": "Dependency and vulnerability tracking"})
                  except urllib.error.HTTPError as exc:
                      if exc.code != 422:
                          raise
                  tracker = call("POST", "/issues", {"title": title, "labels": [label], "body": (
                      MARKER + "\nSingle tracking issue updated silently by the scheduled dependency and vulnerability jobs "
                      "(ecosystem 5.5, OD-75). Edits notify nobody; only the Monday summary comment notifies.")})
              start, end = f"<!-- {SECTION}:start -->", f"<!-- {SECTION}:end -->"
              body = (call("GET", f"/issues/{tracker['number']}") or tracker).get("body") or ""  # fresh copy
              block = f"{start}\n{content}\n{end}"
              i, j = body.find(start), body.find(end)
              body = body[:i] + block + body[j + len(end):] if i != -1 and j > i else body.rstrip() + "\n\n" + block + "\n"
              call("PATCH", f"/issues/{tracker['number']}", {"body": body})
              if should_summarize(now, int(os.environ.get("SUMMARY_WEEKDAY", "1")), os.environ.get("FORCE_SUMMARY") == "true"):
                  total = sum(counts.values())
                  summary = (f"Weekly summary {now.astimezone(ART):%Y-%m-%d}: {total} open finding(s)"
                             + (f" ({', '.join(f'{k.lower()} {v}' for k, v in sorted(counts.items()))})" if total else "")
                             + (f"; compromise watch: {len(hits)} hit(s)" if hits else "")
                             + ". Details and the dependency PR status are in the issue body.")
                  call("POST", f"/issues/{tracker['number']}/comments", {"body": summary})
              print(content)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
